syntax = "proto3";

package common.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/massodo1993/service-example/shared/pkg/proto/common/v1;commonv1";

// NotificationMethod — канал, по которому пользователь получает уведомления.
message NotificationMethod {
  string provider_name = 1; // Имя провайдера (telegram, email, push)
  string target = 2; // Адрес получателя: email, ID чата и т.д.
}

// UserInfo — основная информация о пользователе.
message UserInfo {
  string login = 1; // Логин
  string email = 2; // Email
  repeated NotificationMethod notification_methods = 3; // Каналы уведомлений
}

// User — пользователь.
message User {
  string uuid = 1; // UUID пользователя
  UserInfo info = 2; // Информация о пользователе
  google.protobuf.Timestamp created_at = 3; // Дата регистрации
  google.protobuf.Timestamp updated_at = 4; // Дата обновления
}
