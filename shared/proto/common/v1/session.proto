syntax = "proto3";

package common.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/massodo1993/service-example/shared/pkg/proto/common/v1;commonv1";

// Session — сессия пользователя.
message Session {
  string uuid = 1; // UUID сессии
  google.protobuf.Timestamp created_at = 2; // Дата создания
  google.protobuf.Timestamp expires_at = 3; // Дата истечения
}
